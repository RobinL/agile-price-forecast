name: Refresh forecast

on:
  workflow_dispatch:
    inputs:
      refit:
        description: Refit the model now (normally once it is seven days old)
        type: boolean
        default: false
  # Minute 37 avoids the busiest start of the hour. It also collects within
  # 16:30–17:30 London time in both GMT and BST, preserving a daily training issue.
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: read

concurrency:
  group: production-forecast
  cancel-in-progress: false

jobs:
  forecast:
    if: >-
      github.repository == 'RobinL/agile-price-forecast' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.FORECAST_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.5.25"
          python-version: "3.12"
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install locked dependencies
        run: |
          uv sync --locked --no-dev
          npm ci
      - name: Restore, refresh and save private state
        env:
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          FORCE_REFIT: ${{ inputs.refit || false }}
        run: |
          if [ "$FORCE_REFIT" = "true" ]; then
            uv run --no-dev --locked agile-cloud run --refit
          else
            uv run --no-dev --locked agile-cloud run
          fi
      - name: Build and check the static website (no R2 credentials)
        env:
          DATA_MODE: local
        run: |
          npm run build
          uv run --no-dev --locked agile-cloud check-site --live
      - name: Save only the checked public site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: forecast
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the checked static artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
