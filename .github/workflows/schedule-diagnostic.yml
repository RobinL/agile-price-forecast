name: Schedule diagnostic

# Temporary comparison with Refresh forecast; review after 48 hours.
# No checkout, dependencies, secrets, data feeds, conditions or concurrency group.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  timestamp:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Record when GitHub started this job
        env:
          TRIGGER: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          {
            echo "## Schedule diagnostic"
            echo "Job observed at (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Trigger: $TRIGGER"
            echo "Schedule: $SCHEDULE"
            echo "Run: $GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
            echo "Commit: $GITHUB_SHA"
            echo "Compare scheduled run creation and job start times with Refresh forecast."
            echo "Manual runs only verify execution; they do not test scheduling."
          } | tee -a "$GITHUB_STEP_SUMMARY"
